<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Surf Rental MDP</title>

    <!-- Google Fonts: Plus Jakarta Sans & Outfit (Boutique Luxury Typography) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- The `react-native-web` recommended style reset + Luxury Coastal Design Engine -->
    <style id="expo-reset">
      /* Root element full-height & smooth rendering */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #090C10;
        color: #F1F5F9;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- Luxury Coastal Web Styling Engine (Titanium Radical Upgrade) -->
    <style id="luxury-coastal-css">
      *, *::before, *::after {
        box-sizing: border-box;
      }

      /* Base Typography */
      body, button, input, select, textarea {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      }

      /* Headings & Brand Elements */
      h1, h2, h3, h4, h5, h6, [data-heading="true"] {
        font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif !important;
        letter-spacing: -0.025em;
      }

      /* Atmospheric Maritime Background */
      body {
        background-color: #090C10 !important;
        background-image: 
          radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 229, 255, 0.09) 0%, transparent 100%),
          radial-gradient(ellipse 60% 40% at 85% 20%, rgba(212, 175, 55, 0.05) 0%, transparent 100%),
          radial-gradient(ellipse 50% 30% at 10% 80%, rgba(0, 229, 255, 0.04) 0%, transparent 100%),
          #090C10 !important;
        background-attachment: fixed !important;
      }

      /* Ultra-Luxe Custom Scrollbars (Champagne Gold + Ocean Neon Cyan Hover) */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #090C10;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(212, 175, 55, 0.32);
        border-radius: 9999px;
        border: 2px solid #090C10;
        transition: background 0.25s ease, box-shadow 0.25s ease;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00E5FF;
        box-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(212, 175, 55, 0.32) #090C10;
      }

      /* Luxury Text Selection Highlight */
      ::selection {
        background: rgba(0, 229, 255, 0.3) !important;
        color: #FFFFFF !important;
      }
      ::-moz-selection {
        background: rgba(0, 229, 255, 0.3) !important;
        color: #FFFFFF !important;
      }

      /* Accessible Focus Rings */
      *:focus-visible {
        outline: 2px solid #00E5FF !important;
        outline-offset: 2px;
      }

      /* Interactive Micro-Interactions for Web */
      div[role="button"], button, a {
        transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), 
                    box-shadow 0.18s cubic-bezier(0.16, 1, 0.3, 1), 
                    filter 0.18s ease, 
                    border-color 0.18s ease !important;
      }

      div[role="button"]:hover:not([aria-disabled="true"]), 
      button:hover:not(:disabled) {
        transform: translateY(-1.5px);
        filter: brightness(1.05);
      }

      div[role="button"]:active:not([aria-disabled="true"]), 
      button:active:not(:disabled) {
        transform: scale(0.985);
      }

      /* Input Focus Lighting Effect */
      input, textarea {
        font-family: 'Plus Jakarta Sans', sans-serif !important;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease !important;
      }
      input:focus, textarea:focus {
        border-color: #00E5FF !important;
        box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.18) !important;
      }

      /* Hardware Accelerated Glassmorphism */
      .glass-card, [data-glass="true"] {
        backdrop-filter: blur(20px) saturate(180%) !important;
        -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
      }

      /* Elegant Entrance Animation */
      #root {
        animation: luxuryAppFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes luxuryAppFadeIn {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  <link rel="shortcut icon" href="/favicon.ico" /></head>

  <body>
    <!-- Fallback for JavaScript-disabled environments -->
    <noscript>
      <div style="background:#090C10;color:#F1F5F9;height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;padding:24px;text-align:center;">
        <div>
          <h2 style="color:#00E5FF;margin-bottom:12px;">JavaScript Requerido</h2>
          <p style="color:#94A3B8;">Por favor activá JavaScript en tu navegador para ingresar a Surf Rental Mar del Plata.</p>
        </div>
      </div>
    </noscript>

    <!-- The root element for React Native Web app -->
    <div id="root"></div>
  <script src="/_expo/static/js/web/index-cf52f7e0e9315895ce00158eb2d96b4d.js" defer></script>
</body>
</html>
