<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Surf Rental MDP</title>

    <!-- Google Fonts: Plus Jakarta Sans, Outfit & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- React Native Web Reset -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #030812;
        color: #F8FAFC;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        position: relative;
        z-index: 1;
      }
    </style>

    <!-- Smoked Graphite & Coral Design Engine -->
    <style id="luxury-coastal-css">
      :root {
        --sr-abyss-0: #222630;
        --sr-abyss-1: #2B303C;
        --sr-cyan: #94A3B8;
        --sr-biolum: #E25B3C;
        --sr-seafoam: #64748B;
        --sr-gold: #E5B869;
        --sr-glass-border: rgba(255, 255, 255, 0.10);
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      /* Base Typography */
      body, button, input, select, textarea {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
      }

      /* Headings & Display Typography */
      h1, h2, h3, h4, h5, h6, [data-heading="true"] {
        font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, sans-serif !important;
        letter-spacing: -0.025em;
      }

      /* Lifted Charcoal Slate Atmospheric Canvas (Clean, Even, Zero Muddy Blobs) */
      body {
        position: relative;
        background-color: #222630 !important;
        background-image:
          radial-gradient(ellipse 90% 45% at 50% -10%, rgba(255, 255, 255, 0.035) 0%, transparent 72%),
          linear-gradient(180deg, #21252F 0%, #272B36 52%, #222630 100%) !important;
        background-attachment: fixed !important;
      }

      /* Subtle Architectural Top Light Veil (Neutral, zero green/orange fog) */
      body::before {
        content: "";
        position: fixed;
        inset: -20% -15%;
        pointer-events: none;
        z-index: 0;
        background:
          radial-gradient(46% 36% at 50% 10%, rgba(255, 255, 255, 0.032) 0%, transparent 72%),
          radial-gradient(36% 28% at 50% 85%, rgba(226, 91, 60, 0.025) 0%, transparent 74%);
        filter: blur(56px);
        will-change: transform, opacity;
        animation: auroraDriftA 26s ease-in-out infinite alternate;
      }

      /* Delicate Diagonal Light Veil */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        opacity: 0.22;
        background: linear-gradient(125deg, rgba(255, 255, 255, 0.022) 0%, transparent 42%, rgba(255, 255, 255, 0.012) 100%);
      }

      /* Warm Architectural Stone Light-Mode Adaptation */
      html[data-theme="light"] body {
        background-color: #F5F6F8 !important;
        background-image:
          radial-gradient(ellipse 85% 45% at 50% -10%, rgba(255, 255, 255, 0.7) 0%, transparent 70%),
          linear-gradient(180deg, #F9FAFB 0%, #F5F6F8 55%, #F0F2F5 100%) !important;
      }

      html[data-theme="light"] body::before {
        background:
          radial-gradient(45% 34% at 50% 14%, rgba(255, 255, 255, 0.55) 0%, transparent 72%);
      }

      html[data-theme="light"] body::after {
        opacity: 0.28;
        background: linear-gradient(125deg, rgba(255, 255, 255, 0.5) 0%, transparent 50%, rgba(15, 23, 42, 0.015) 100%);
      }

      /* Custom Scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.16);
        border-radius: 9999px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(226, 91, 60, 0.58);
      }
      html[data-theme="light"] ::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.16);
      }
      html[data-theme="light"] ::-webkit-scrollbar-thumb:hover {
        background: rgba(226, 91, 60, 0.55);
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
      }
      html[data-theme="light"] * {
        scrollbar-color: rgba(0, 0, 0, 0.16) transparent;
      }

      /* Selection & Accessible Focus */
      ::selection {
        background: rgba(226, 91, 60, 0.28) !important;
        color: #FFFFFF !important;
      }
      ::-moz-selection {
        background: rgba(226, 91, 60, 0.28) !important;
        color: #FFFFFF !important;
      }
      *:focus-visible {
        outline: 2px solid #E25B3C !important;
        outline-offset: 2px;
      }

      /* Ambient Floating Screen Glow Orbs */
      [data-ambient-glow="cyan"] {
        will-change: transform, opacity;
        animation: orbFloatCyan 20s ease-in-out infinite alternate;
      }
      [data-ambient-glow="gold"] {
        will-change: transform, opacity;
        animation: orbFloatGold 24s ease-in-out infinite alternate;
      }

      /* Screen & View Fluid iOS/Linear Entrance */
      [data-screen-enter="true"] {
        animation: screenSlideFadeIn 0.36s cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* Brand Header Logo & Live Coastal Dot */
      [data-brand-logo="true"] {
        transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.32s ease !important;
      }
      [data-brand-logo="true"]:hover {
        transform: scale(1.06);
        box-shadow: 0 6px 18px rgba(226, 91, 60, 0.22);
      }

      [data-live-dot="true"] {
        position: relative;
        box-shadow: 0 0 8px rgba(16, 185, 129, 0.72);
        animation: liveBeaconPulse 2.8s ease-in-out infinite;
      }

      [data-telemetry-pill="true"] {
        transition: border-color 0.28s ease, background-color 0.28s ease !important;
      }
      [data-telemetry-pill="true"]:hover {
        border-color: rgba(255, 255, 255, 0.18) !important;
      }

      /* Hero Banner: Calm Editorial Depth & Ultra-Smooth Optical Ken Burns */
      [data-hero-banner="true"] {
        box-shadow: 0 24px 56px -16px rgba(0, 0, 0, 0.72),
                    inset 0 1px 0 rgba(255, 255, 255, 0.09) !important;
        transition: border-color 0.32s ease, box-shadow 0.32s ease !important;
      }
      html[data-theme="light"] [data-hero-banner="true"] {
        box-shadow: 0 20px 46px -16px rgba(0, 0, 0, 0.22),
                    inset 0 1px 0 rgba(255, 255, 255, 0.25) !important;
      }
      [data-hero-banner="true"] img {
        will-change: transform;
        animation: heroKenBurns 26s ease-in-out infinite alternate;
      }

      [data-hero-chip="true"] {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                    border-color 0.24s ease,
                    background-color 0.24s ease !important;
      }
      [data-hero-chip="true"]:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.22) !important;
      }

      /* Live Marine Telemetry Sonar & Instrument Dials */
      [data-radar-pulse="true"] {
        position: relative;
        overflow: visible !important;
      }
      [data-radar-pulse="true"]::after {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: 9999px;
        border: 1.5px solid rgba(16, 185, 129, 0.65);
        pointer-events: none;
        animation: sonarRingExpand 2.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      [data-telemetry-dial="true"] {
        transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                    border-color 0.28s ease,
                    background-color 0.28s ease !important;
      }
      [data-telemetry-dial="true"]:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.16) !important;
      }
      html[data-theme="light"] [data-telemetry-dial="true"]:hover {
        border-color: rgba(0, 0, 0, 0.13) !important;
      }

      /* Form Inputs & Refined Focus Halo */
      [data-input-shell] {
        transition: border-color 0.22s ease, box-shadow 0.22s ease, background-color 0.22s ease !important;
      }
      [data-input-shell]:focus-within,
      [data-input-shell="focused"] {
        border-color: #E25B3C !important;
        box-shadow: 0 0 0 3px rgba(226, 91, 60, 0.14) !important;
      }
      [data-input-shell] input:focus,
      [data-input-shell] textarea:focus {
        outline: none !important;
        box-shadow: none !important;
      }
      input:not([data-input-shell] input):focus,
      textarea:not([data-input-shell] textarea):focus {
        border-color: #E25B3C !important;
        box-shadow: 0 0 0 3px rgba(226, 91, 60, 0.14) !important;
      }

      /* Primary & Secondary Silk Sheen Buttons */
      [data-luxury-btn="primary"] {
        position: relative;
        overflow: hidden !important;
        transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1),
                    box-shadow 0.26s ease,
                    filter 0.26s ease !important;
      }
      [data-luxury-btn="primary"]::after {
        content: "";
        position: absolute;
        top: 0;
        left: -130%;
        width: 65%;
        height: 100%;
        background: linear-gradient(
          105deg,
          transparent 0%,
          rgba(255, 255, 255, 0.08) 38%,
          rgba(255, 255, 255, 0.24) 50%,
          rgba(255, 255, 255, 0.08) 62%,
          transparent 100%
        );
        transform: skewX(-22deg);
        pointer-events: none;
        transition: left 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      }
      [data-luxury-btn="primary"]:hover::after {
        left: 160%;
      }
      [data-luxury-btn="primary"]:hover {
        filter: brightness(1.05);
        box-shadow: 0 10px 26px -6px rgba(226, 91, 60, 0.42),
                    inset 0 1px 0 rgba(255, 255, 255, 0.32) !important;
      }

      [data-luxury-btn="secondary"]:hover,
      [data-luxury-btn="ghost"]:hover {
        border-color: rgba(255, 255, 255, 0.22) !important;
        background-color: rgba(255, 255, 255, 0.09) !important;
      }
      html[data-theme="light"] [data-luxury-btn="secondary"]:hover,
      html[data-theme="light"] [data-luxury-btn="ghost"]:hover {
        border-color: rgba(0, 0, 0, 0.16) !important;
        background-color: #EAEAEF !important;
      }

      [data-oauth-btn="true"] {
        transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                    box-shadow 0.22s ease,
                    filter 0.22s ease !important;
      }
      [data-oauth-btn="true"]:hover {
        transform: translateY(-1.5px);
        box-shadow: 0 8px 20px -6px rgba(0, 0, 0, 0.22) !important;
      }

      /* Surfboard Cards: Weighted Apple Levitation + Optical Zoom + Specular Polish */
      [data-surf-card="true"] {
        position: relative;
        transition: transform 0.34s cubic-bezier(0.22, 1, 0.36, 1),
                    border-color 0.30s ease,
                    box-shadow 0.34s cubic-bezier(0.22, 1, 0.36, 1) !important;
        box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.55),
                    inset 0 1px 0 rgba(255, 255, 255, 0.06) !important;
      }
      [data-surf-card="true"]::after {
        content: "";
        position: absolute;
        top: 0;
        left: -130%;
        width: 60%;
        height: 100%;
        background: linear-gradient(
          110deg,
          transparent 0%,
          rgba(255, 255, 255, 0.02) 38%,
          rgba(255, 255, 255, 0.07) 50%,
          rgba(255, 255, 255, 0.02) 62%,
          transparent 100%
        );
        transform: skewX(-20deg);
        pointer-events: none;
        z-index: 6;
        transition: left 0.72s cubic-bezier(0.22, 1, 0.36, 1);
      }
      [data-surf-card="true"]:hover::after {
        left: 165%;
      }
      [data-surf-card="true"]:hover {
        transform: translateY(-4px) !important;
        border-color: rgba(255, 255, 255, 0.18) !important;
        box-shadow: 0 22px 46px -14px rgba(0, 0, 0, 0.72),
                    inset 0 1px 0 rgba(255, 255, 255, 0.12) !important;
      }
      [data-surf-image-frame="true"] img {
        transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1) !important;
      }
      [data-surf-card="true"]:hover [data-surf-image-frame="true"] img {
        transform: scale(1.045);
      }

      [data-surf-reserve="true"] {
        transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                    box-shadow 0.24s ease,
                    filter 0.24s ease !important;
      }
      [data-surf-reserve="true"]:hover {
        transform: translateY(-1px);
        filter: brightness(1.06);
        box-shadow: 0 8px 20px -4px rgba(226, 91, 60, 0.38) !important;
      }

      /* Smooth Card Entrance Animation */
      [data-stagger-card="true"] {
        animation: cardFloatIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) backwards;
      }

      /* Filter Pills */
      [data-filter-pill] {
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        transition: transform 0.20s cubic-bezier(0.22, 1, 0.36, 1),
                    border-color 0.20s ease,
                    box-shadow 0.20s ease,
                    background-color 0.20s ease !important;
      }
      [data-filter-pill]:hover {
        transform: translateY(-1.5px);
        border-color: rgba(226, 91, 60, 0.45) !important;
      }
      [data-filter-pill="active"] {
        box-shadow: 0 6px 18px -6px rgba(226, 91, 60, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.14) !important;
      }

      /* Floating Dock Navigation Tabs */
      [role="tablist"] {
        transition: box-shadow 0.28s ease, border-color 0.28s ease !important;
      }
      [role="tab"] {
        transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease !important;
      }
      [role="tab"]:hover {
        transform: translateY(-1.5px);
      }

      /* Scroll-to-Top Ring Button */
      [data-scroll-top-btn="true"] {
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.24s ease !important;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.42) !important;
      }
      [data-scroll-top-btn="true"]:hover {
        transform: translateY(-2.5px) scale(1.04);
        border-color: rgba(226, 91, 60, 0.45) !important;
        box-shadow: 0 14px 32px rgba(0, 0, 0, 0.55) !important;
      }

      /* Hardware Accelerated Smoked Glass Surfaces */
      .glass-card, [data-glass], [data-glass-card="true"] {
        backdrop-filter: blur(22px) saturate(160%) !important;
        -webkit-backdrop-filter: blur(22px) saturate(160%) !important;
        transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                    border-color 0.28s ease,
                    box-shadow 0.28s ease !important;
      }
      [data-glass-card="true"]:hover {
        border-color: rgba(255, 255, 255, 0.15) !important;
        box-shadow: 0 18px 40px -14px rgba(0, 0, 0, 0.72),
                    inset 0 1px 0 rgba(255, 255, 255, 0.09) !important;
      }
      [data-theme-toggle="true"] {
        transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1),
                    border-color 0.22s ease !important;
      }
      [data-theme-toggle="true"]:hover {
        transform: scale(1.07);
        border-color: rgba(226, 91, 60, 0.42) !important;
      }

      /* Pearl Alabaster Light-Mode Surface Polish */
      html[data-theme="light"] [data-surf-card="true"] {
        box-shadow: 0 10px 28px -10px rgba(0, 0, 0, 0.08),
                    inset 0 1px 0 rgba(255, 255, 255, 0.95) !important;
      }
      html[data-theme="light"] [data-surf-card="true"]:hover {
        border-color: rgba(0, 0, 0, 0.14) !important;
        box-shadow: 0 20px 42px -12px rgba(0, 0, 0, 0.13),
                    inset 0 1px 0 rgba(255, 255, 255, 1) !important;
      }
      html[data-theme="light"] [data-glass-card="true"]:hover {
        border-color: rgba(0, 0, 0, 0.12) !important;
        box-shadow: 0 14px 34px -10px rgba(0, 0, 0, 0.09),
                    inset 0 1px 0 rgba(255, 255, 255, 1) !important;
      }
      html[data-theme="light"] [data-scroll-top-btn="true"] {
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.10) !important;
      }

      /* Root Entrance Animation */
      #root {
        animation: luxuryAppFadeIn 0.42s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* Keyframes */
      @keyframes luxuryAppFadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes screenSlideFadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes auroraDriftA {
        0% {
          transform: translate3d(-1.5%, -1%, 0) scale(1);
          opacity: 0.90;
        }
        50% {
          transform: translate3d(2%, 1.5%, 0) scale(1.04);
          opacity: 1;
        }
        100% {
          transform: translate3d(-1%, 2%, 0) scale(1.02);
          opacity: 0.92;
        }
      }

      @keyframes orbFloatCyan {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        100% {
          transform: translate3d(32px, 20px, 0) scale(1.08);
        }
      }

      @keyframes orbFloatGold {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        100% {
          transform: translate3d(-28px, 18px, 0) scale(1.07);
        }
      }

      @keyframes heroKenBurns {
        0% {
          transform: scale(1) translate3d(0, 0, 0);
        }
        100% {
          transform: scale(1.05) translate3d(-0.8%, -0.8%, 0);
        }
      }

      @keyframes sonarRingExpand {
        0% {
          transform: scale(0.95);
          opacity: 0.80;
        }
        75% {
          transform: scale(2.05);
          opacity: 0;
        }
        100% {
          transform: scale(2.05);
          opacity: 0;
        }
      }

      @keyframes liveBeaconPulse {
        0%, 100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(1.16);
          opacity: 0.82;
        }
      }

      @keyframes cardFloatIn {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes splashLogoFloat {
        0%, 100% {
          transform: translateY(0px);
          box-shadow: 0 18px 44px rgba(0, 0, 0, 0.72), 0 0 28px rgba(255, 90, 54, 0.22);
        }
        50% {
          transform: translateY(-5px);
          box-shadow: 0 24px 52px rgba(0, 0, 0, 0.78), 0 0 38px rgba(255, 90, 54, 0.34);
        }
      }

      @keyframes splashWaveBar {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(220%);
        }
      }

      /* Enforce inactive React Navigation screen hiding on web */
      [hidden] {
        display: none !important;
      }

      /* Respect User Motion Preferences */
      @media (prefers-reduced-motion: reduce) {
        body::before,
        body::after,
        [data-ambient-glow],
        [data-screen-enter="true"],
        [data-hero-banner="true"] img,
        [data-radar-pulse="true"]::after,
        [data-live-dot="true"],
        [data-stock-pulse="true"],
        [data-stagger-card="true"] {
          animation: none !important;
        }
        [data-surf-card="true"],
        [data-luxury-btn],
        [data-filter-pill],
        [data-hero-chip],
        [data-glass-card="true"] {
          transition: none !important;
        }
      }
    </style>
  <link rel="shortcut icon" href="/favicon.ico" /></head>

  <body>
    <!-- Fallback for JavaScript-disabled environments -->
    <noscript>
      <div style="background:#222630;color:#F5F5F7;height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;padding:24px;text-align:center;">
        <div>
          <h2 style="color:#E25B3C;margin-bottom:12px;">JavaScript Requerido</h2>
          <p style="color:#B4B8C4;">Por favor activá JavaScript en tu navegador para ingresar a Surf Rental Mar del Plata.</p>
        </div>
      </div>
    </noscript>

    <!-- The root element for React Native Web app (Balanced Slate & Terracotta Splash Loader) -->
    <div id="root">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#222630;color:#F5F5F7;font-family:'Outfit',sans-serif;text-align:center;padding:24px;">
        <div style="width:82px;height:82px;border-radius:24px;background:rgba(45,50,64,0.92);border:1.5px solid rgba(226,91,60,0.40);display:flex;align-items:center;justify-content:center;margin-bottom:22px;animation:splashLogoFloat 3s ease-in-out infinite;">
          <svg width="44" height="44" viewBox="0 0 120 120" fill="none">
            <path d="M60 12C73 34 79 58 75 88C73 100 67 106 60 108C53 106 47 100 45 88C41 58 47 34 60 12Z" fill="rgba(226,91,60,0.20)" stroke="#E25B3C" stroke-width="3.5"/>
            <line x1="60" y1="16" x2="60" y2="105" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M18 82C32 72 46 72 60 80C74 88 88 88 102 78" stroke="#E25B3C" stroke-width="5" stroke-linecap="round"/>
          </svg>
