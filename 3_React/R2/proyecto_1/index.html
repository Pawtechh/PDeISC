<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de tareas - Rutas</title>
    <script>
      // Script anti-flash: aplica el tema guardado ANTES de que React cargue,
      // para evitar el parpadeo blanco al recargar la página.
      (function () {
        var tema = localStorage.getItem("tema") || "claro";
        if (tema === "oscuro") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
