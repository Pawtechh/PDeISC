<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtro TXT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4" id="mainNavbar">
    <div class="container-xl">
        <span class="navbar-brand fw-bold fs-4">
            <i class="bi bi-file-earmark-text me-2"></i>Filtro Inteligente TXT
        </span>
        <div class="ms-auto">
            <button id="themeButton" class="btn btn-outline-secondary btn-sm px-3">
                <i class="bi bi-moon-fill me-1"></i>Modo Oscuro
            </button>
        </div>
    </div>
</nav>

<div class="container-xl px-4">

    <!-- Upload card -->
    <div class="row justify-content-center mb-4">
        <div class="col-lg-8">
            <div class="card shadow-sm upload-card">
                <div class="card-body p-4">
                    <h5 class="card-title mb-3 fw-semibold">
                        <i class="bi bi-upload me-2 text-primary"></i>Cargar archivo
                    </h5>
                    <form id="uploadForm" class="d-flex align-items-center gap-3 flex-wrap">
                        <div class="flex-grow-1">
                            <input type="file" id="txtFile" accept=".txt" required class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">
                            <i class="bi bi-cpu me-2"></i>Procesar Archivo
                        </button>
                    </form>
                    <div id="message" class="mt-3 fw-semibold text-center d-none"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Results -->
    <div class="row g-4" id="resultsSection" style="display:none !important;">

        <div class="col-lg-4">
            <div class="card shadow-sm h-100 result-card">
                <div class="card-header d-flex align-items-center gap-2">
                    <i class="bi bi-check2-circle text-success fs-5"></i>
                    <span class="fw-semibold">Números Útiles</span>
                    <span class="badge bg-success ms-auto" id="badgeUseful">0</span>
                </div>
                <div class="card-body p-3">
                    <ul id="usefulList" class="list-group list-group-flush number-list"></ul>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm h-100 result-card">
                <div class="card-header d-flex align-items-center gap-2">
                    <i class="bi bi-stars text-warning fs-5"></i>
                    <span class="fw-semibold">Números Factoriales</span>
                    <span class="badge bg-warning text-dark ms-auto" id="badgeFactorial">0</span>
                </div>
                <div class="card-body p-3">
                    <ul id="factorialList" class="list-group list-group-flush number-list"></ul>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm h-100 result-card">
                <div class="card-header d-flex align-items-center gap-2">
                    <i class="bi bi-bar-chart-fill text-info fs-5"></i>
                    <span class="fw-semibold">Estadísticas</span>
                </div>
                <div class="card-body p-4">
                    <div class="stat-item mb-3">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="text-muted small">Números útiles</span>
                            <span id="usefulCount" class="fw-bold text-success">—</span>
                        </div>
                    </div>
                    <div class="stat-item mb-3">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="text-muted small">Números no útiles</span>
                            <span id="uselessCount" class="fw-bold text-danger">—</span>
                        </div>
                    </div>
                    <hr>
                    <div class="stat-item">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted small">Porcentaje útiles</span>
                            <span id="percentage" class="fw-bold text-primary">—</span>
                        </div>
                        <div class="progress" style="height:10px;">
                            <div class="progress-bar bg-primary" id="progressBar" role="progressbar" style="width:0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="script.js"></script>

</body>
</html>
