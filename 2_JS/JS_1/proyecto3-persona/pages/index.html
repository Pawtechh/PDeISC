<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 3 - Gestión de Personas | LocalStorage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
    <div class="theme-toggle-container">
        <button id="themeToggle" class="btn btn-theme-toggle">
            <i class="fas fa-moon"></i> Modo Oscuro
        </button>
    </div>

    <div class="container-fluid p-4">
        <h1 class="text-center mb-4">👥 Gestión de Personas</h1>
        
        <div class="row">
            <!-- Formulario (10+ campos) -->
            <div class="col-12 col-lg-7 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="personaForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre *</label>
                                    <input type="text" class="form-control" id="nombre" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Apellido *</label>
                                    <input type="text" class="form-control" id="apellido" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Edad *</label>
                                    <input type="number" class="form-control" id="edad" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Fecha nacimiento *</label>
                                    <input type="date" class="form-control" id="fechaNac" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Sexo *</label>
                                    <select class="form-select" id="sexo" required>
                                        <option value="">Seleccione</option>
                                        <option>Masculino</option>
                                        <option>Femenino</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Documento *</label>
                                    <input type="text" class="form-control" id="documento" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Estado civil *</label>
                                    <select class="form-select" id="estadoCivil" required>
                                        <option>Soltero/a</option>
                                        <option>Casado/a</option>
                                        <option>Divorciado/a</option>
                                        <option>Viudo/a</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nacionalidad *</label>
                                    <input type="text" class="form-control" id="nacionalidad" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Teléfono *</label>
                                    <input type="tel" class="form-control" id="telefono" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Email *</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">¿Tiene hijos?</label>
                                    <select class="form-select" id="tieneHijos">
                                        <option value="0">No</option>
                                        <option value="1">Sí</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3" id="hijosContainer" style="display:none;">
                                    <label class="form-label">Cantidad de hijos</label>
                                    <input type="number" class="form-control" id="cantidadHijos" min="0" value="0">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Guardar Persona</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <!-- Listado de nombres completos -->
            <div class="col-12 col-lg-5 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5><i class="fas fa-list"></i> Listado de Nombres Completos</h5>
                        <div id="mensaje" class="alert alert-info small">Complete y guarde una persona</div>
                        <div id="listaNombres" class="lista-nombres">
                            <p class="text-muted">No hay personas registradas</p>
                        </div>
                        <hr>
                        <button id="btnExportar" class="btn btn-sm btn-outline-success w-100">📋 Exportar todos los datos</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Listado horizontal de personas (todos los datos) -->
        <div class="row mt-3">
            <div class="col-12">
                <h3>👤 Personas registradas <small class="text-muted" id="contadorPersonas">(0)</small></h3>
                <div id="listaPersonas" class="personas-horizontal">
                    <p class="text-muted">No hay personas aún</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/modules/theme.js"></script>
    <script type="module" src="/modules/personasManager.js"></script>
    <script type="module" src="/scripts/main.js"></script>
</body>
</html>
