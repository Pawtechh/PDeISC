<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 1 - 3 Formas de Lectura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
    <div class="theme-toggle-container">
        <button id="themeToggle" class="btn btn-theme-toggle">
            <i class="fas fa-moon"></i> Modo Oscuro
        </button>
    </div>

    <div class="container-fluid p-4">
        <h1 class="text-center mb-4">📋 Formulario de Productos</h1>
        <p class="text-center mb-4">Deportes | Herramientas | Precios | Stock | Proveedor | Fecha | Peso | Descuento</p>
        
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="productForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre del producto *</label>
                                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Categoría *</label>
                                    <select class="form-select" id="categoria" name="categoria" required>
                                        <option value="">Seleccione...</option>
                                        <option>Deporte</option>
                                        <option>Herramienta</option>
                                        <option>Ambos</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Precio (USD) *</label>
                                    <input type="number" class="form-control" id="precio" name="precio" step="0.01" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Stock *</label>
                                    <input type="number" class="form-control" id="stock" name="stock" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Proveedor *</label>
                                    <input type="text" class="form-control" id="proveedor" name="proveedor" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Fecha ingreso *</label>
                                    <input type="date" class="form-control" id="fechaIngreso" name="fechaIngreso" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Peso (kg) *</label>
                                    <input type="number" class="form-control" id="peso" name="peso" step="0.01" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Descuento (%)</label>
                                    <input type="number" class="form-control" id="descuento" name="descuento" min="0" max="100" value="0">
                                </div>
                            </div>
                            <div class="d-flex gap-2 mt-3">
                                <button type="button" id="btnValue" class="btn btn-primary flex-grow-1">1️⃣ .value</button>
                                <button type="button" id="btnFormData" class="btn btn-success flex-grow-1">2️⃣ FormData</button>
                                <button type="button" id="btnQuerySelector" class="btn btn-info flex-grow-1">3️⃣ querySelector</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <div id="resultado" class="alert alert-secondary">
                    <strong>Resultado:</strong> Presione un botón
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <h3>📦 Productos <small id="contadorProductos">(0)</small></h3>
                <div id="listaProductos" class="productos-horizontal">
                    <p class="text-muted">Sin productos</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../modules/theme.js"></script>
    <script type="module" src="../scripts/main.js"></script>
</body>
</html>
